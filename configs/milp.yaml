algorithm: milp

num_samples:
  train: 10000
  val: 512
  test: 512

problem_size:
  train: 20
  val: 20
  test: 32

batch_size: 32
learning_rate: 0.0001
weight_decay: 0.0
num_iterations: 20000
eval_each: 500

stepwise_training: true
processor_upper_t: 3.0
processor_lower_t: 0.01
use_noise: true
temp_on_eval: 0.0
h: 128

output_type: node_mask
output_idx: 1

models_directory: models
tensorboard_logs: true

milp_num_constraints: 8
milp_int_ratio: 0.6